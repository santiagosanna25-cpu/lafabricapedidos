<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La Fábrica - Tienda de Artesanales</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    touch-action:manipulation;
    background:#0f0f0f;
    color:white;
    font-family:'Segoe UI',Arial,sans-serif;
}
/* HEADER */
header{
    width:100%;
    height:160px;
    overflow:hidden;
    border-bottom:2px solid #1a1a1a;
}
header img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* INPUTS */
.inputs{
    background:#1a1a1a;
    padding:15px;
    position:sticky;
    top:0;
    z-index:10;
}
.inputs input,
.inputs textarea{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #333;
    background:#2a2a2a;
    color:white;
    font-size:15px;
    outline:none;
}
/* CONTENEDOR */
.container{
    padding:10px;
    padding-bottom:160px;
}
/* CATEGORIAS */
.categoria{
    margin-bottom:20px;
}
.titulo-categoria{
    font-size:20px;
    font-weight:bold;
    padding:12px 10px;
    margin-bottom:10px;
    border-radius:10px;
    background:#222;
    border-left:5px solid #00ff88;
}
/* PRODUCTOS */
.product{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1c1c1c;
    margin-bottom:12px;
    padding:12px;
    border-radius:14px;
    box-shadow:0 4px 6px rgba(0,0,0,0.3);
}
.left{
    display:flex;
    align-items:center;
    gap:12px;
    flex:1;
}
.foto{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    background:#2a2a2a;
}
.info-prod{
    display:flex;
    flex-direction:column;
}
.name{
    font-weight:bold;
    font-size:15px;
    margin-bottom:4px;
}
.price{
    color:#00ff88;
    font-size:14px;
    font-weight:bold;
}
/* CONTROLES */
.controls{
    display:flex;
    align-items:center;
    gap:4px;
}
.btn-qty{
    background:#333;
    border:none;
    color:white;
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    min-width:35px;
}
.btn-qty:active{
    background:#444;
    transform:scale(0.9);
}
.cantidad{
    min-width:25px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
    color:#fff;
}
/* FOOTER */
.total{
    position:fixed;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.95);
    backdrop-filter:blur(10px);
    padding:15px;
    border-top:1px solid #333;
}
.total-text{
    font-size:20px;
    font-weight:bold;
    text-align:center;
    margin-bottom:10px;
}
.botones-footer{
    display:flex;
    gap:10px;
}
.botones-footer button{
    flex:1;
    padding:15px;
    border-radius:12px;
    border:none;
    font-weight:bold;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.whatsapp{
    background:#25d366;
    color:black;
}
.imprimir{
    background:#4a90e2;
    color:white;
}
</style>
</head>
<body>
<header>
<img src="logo.png" alt="Logo La Fábrica">
</header>
<div class="inputs">
<input
id="nombre"
type="text"
placeholder="👤 Nombre del cliente"
>
<textarea
id="detalle"
rows="2"
placeholder="📝 Notas (ej: feteado, sin sal...)"
></textarea>
</div>
<div class="container" id="products"></div>
<div class="total">
<div class="total-text">
Total: $<span id="total">0</span>
</div>
<div class="botones-footer">
<button
class="imprimir"
onclick="imprimirPedido()"
>
🖨️ Ticket
</button>
<button
class="whatsapp"
onclick="enviarPedido()"
>
📱 WhatsApp
</button>
</div>
</div>
<script>
/* ==========================================
   PRODUCTOS
========================================== */
const productos = [
    { nombre:"Criollitos", precio:4600, img:"criollitos.jpg", categoria:"Quesos" },
    { nombre:"Criollitos al vacío", precio:4900, img:"vacio.jpg", categoria:"Quesos" },
    { nombre:"Queso criollo", precio:8000, img:"criollo.jpg", categoria:"Quesos" },
    { nombre:"Criollo grande", precio:8500, img:"grande.jpg", categoria:"Quesos" },
    { nombre:"Criollos medianos", precio:5500, img:"criollos.jpg", categoria:"Quesos" },
    { nombre:"Queso cáscara roja", precio:8200, img:"cascararoja.jpg", categoria:"Quesos" },
    { nombre:"Holanda", precio:8200, img:"holanda.jpg", categoria:"Quesos" },
    { nombre:"Queso semiduro", precio:8500, img:"semiduro.jpg", categoria:"Quesos" },
    { nombre:"Queso criollo en barra", precio:10000, img:"barra.jpg", categoria:"Quesos" },
    { nombre:"Quesillo tradicional", precio:3500, img:"quesillo.jpg", categoria:"Quesillos" },
    { nombre:"Quesillos postre", precio:19000, img:"Quesillos postre.jpg", categoria:"Quesillos" },
    { nombre:"Caciocavallo", precio:9000, img:"caciocavallo.jpg", categoria:"Quesillos" },
    { nombre:"Provoleta", precio:5000, img:"provoleta.jpg", categoria:"Quesillos" },
    { nombre:"Quesillos x10", precio:18000, img:"quesillos10.jpg", categoria:"Quesillos" },
    { nombre:"Rollitos de quesillo", precio:2100, img:"rollitos.jpg", categoria:"Quesillos" },
    { nombre:"Rollitos x5", precio:10500, img:"rollitos5.jpg", categoria:"Quesillos" },
    { nombre:"Dulce de leche", precio:4000, img:"dulce.jpg", categoria:"Dulces" },
    { nombre:"Dulce de chayote", precio:4000, img:"chayote.jpg", categoria:"Dulces" },
    { nombre:"Higos en almíbar", precio:4000, img:"higos.jpg", categoria:"Dulces" },
    { nombre:"Mini mortadela", precio:6800, img:"mortadela.jpg", categoria:"Salames" },
    { nombre:"Chacarero bastón", precio:7200, img:"chacarero.jpg", categoria:"Salames" },
    { nombre:"Salamines picado fino", precio:4200, img:"salamin.jpg", categoria:"Salames" },
    { nombre:"Salame criollo bastón", precio:7200, img:"salame.jpg", categoria:"Salames" }
];
let carrito = Array(productos.length).fill(0);

const categorias = ["Quesos", "Quesillos", "Dulces", "Salames"];

function render(){
    const container = document.getElementById("products");
    container.innerHTML = "";
    categorias.forEach(categoria => {
        const productosCategoria = productos
            .map((p,i)=>({p,i}))
            .filter(x => x.p.categoria === categoria);

        if(productosCategoria.length === 0) return;

        let html = `
        <div class="categoria">
            <div class="titulo-categoria">${categoria}</div>
        `;
        productosCategoria.forEach(({p,i}) => {
            html += `
            <div class="product">
                <div class="left">
                    <img src="${p.img}" class="foto" onerror="this.style.display='none'">
                    <div class="info-prod">
                        <div class="name">${p.nombre}</div>
                        <div class="price">$${p.precio.toLocaleString('es-AR')}</div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn-qty" onclick="cambiar(${i},-1)">-</button>
                    <div class="cantidad">${carrito[i]}</div>
                    <button class="btn-qty" onclick="cambiar(${i},1)">+</button>
                    <button class="btn-qty" style="margin-left:5px;background:#444" onclick="cambiar(${i},10)">+10</button>
                </div>
            </div>
            `;
        });
        html += `</div>`;
        container.innerHTML += html;
    });
}

function cambiar(i,q){
    carrito[i] += q;
    if(carrito[i] < 0) carrito[i] = 0;
    actualizarTotal();
    render();
}

function actualizarTotal(){
    let t = 0;
    productos.forEach((p,i)=>{ t += p.precio * carrito[i]; });
    document.getElementById("total").innerText = t.toLocaleString('es-AR');
}

function enviarPedido(){
    if(!carrito.some(c=>c>0)) return alert("Agrega al menos un producto");
    let nombre = document.getElementById("nombre").value || "Cliente";
    let m = `🧀 *PEDIDO - LA FÁBRICA*\n👤 Cliente: ${nombre}\n--------------------------\n`;
    categorias.forEach(categoria=>{
        const seleccionados = productos
            .map((p,i)=>({p,i}))
            .filter(x => x.p.categoria === categoria && carrito[x.i] > 0);
        if(seleccionados.length === 0) return;
        m += `\n*${categoria.toUpperCase()}*\n`;
        seleccionados.forEach(({p,i})=>{
            m += `• ${p.nombre} x${carrito[i]} ($${(p.precio*carrito[i]).toLocaleString('es-AR')})\n`;
        });
    });
    m += `\n💰 *Total: $${document.getElementById("total").innerText}*`;
    let d = document.getElementById("detalle").value;
    if(d) m += `\n\n📝 Nota: ${d}`;
    window.open("https://wa.me/5493816062471?text=" + encodeURIComponent(m));
}

/* ==========================================
   IMPRIMIR EN POS-80 DESDE IPHONE
========================================== */
async function imprimirPedido(){
    if(!carrito.some(c=>c>0)){
        return alert("No hay productos seleccionados");
    }

    const IP_NOTEBOOK = "192.168.1.236";

    let nombre = document.getElementById("nombre").value || "CLIENTE";
    let detalle = document.getElementById("detalle").value;
    let fecha = new Date().toLocaleString('es-AR');
    let total = document.getElementById("total").innerText;

    let ticketHtml = `
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <style>
            @page { margin: 0; }
            body {
                width: 72mm;
                font-family: monospace;
                font-size: 12px;
                margin: 0 auto;
                padding: 2mm;
                color: black;
                background: white;
            }
            h2 { font-size: 18px; margin: 0; text-align: center; }
            p { margin: 2px 0; }
            table { width: 100%; border-collapse: collapse; margin-top: 5px; }
            td { padding: 2px 0; vertical-align: top; }
            td:first-child { text-align: left; }
            td:last-child { text-align: right; }
            .categoria-ticket {
                margin-top: 8px;
                font-weight: bold;
                border-bottom: 1px dashed black;
            }
            .center { text-align: center; }
        </style>
    </head>
    <body>
        <div class="center">
            <h2>LA FÁBRICA</h2>
            <p>Artesanales de Calidad</p>
            <p>--------------------------------</p>
            <p>FECHA: ${fecha}</p>
            <p>CLIENTE: ${nombre}</p>
            <p>--------------------------------</p>
        </div>
    `;

    categorias.forEach(categoria => {
        const seleccionados = productos
            .map((p,i) => ({p,i}))
            .filter(x => x.p.categoria === categoria && carrito[x.i] > 0);
            
        if(seleccionados.length === 0) return;

        ticketHtml += `<div class="categoria-ticket">${categoria.toUpperCase()}</div><table>`;
        
        seleccionados.forEach(({p,i}) => {
            const subtotal = p.precio * carrito[i];
            ticketHtml += `
                <tr>
                    <td>${p.nombre}<br>${carrito[i]} x $${p.precio.toLocaleString('es-AR')}</td>
                    <td>$${subtotal.toLocaleString('es-AR')}</td>
                </tr>
            `;
        });
        ticketHtml += `</table>`;
    });

    ticketHtml += `
        <div class="center">
            <p>--------------------------------</p>
            <h3>TOTAL: $${total}</h3>
            <p>--------------------------------</p>
            ${detalle ? `<p><strong>NOTA:</strong><br>${detalle}</p>` : ""}
            <p style="margin-top:8px;">¡Muchas gracias por su compra!</p>
        </div>
    </body>
    </html>
    `;

    try {
        await fetch(`http://${IP_NOTEBOOK}:3000/imprimir`, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ html: ticketHtml })
        });

        alert("🖨️ Orden enviada a la impresora");
    } catch (error) {
        // Alternativa directa mediante AirPrint si la notebook está apagada o con fallas
        let w = window.open('', '_blank');
        if (w) {
            w.document.write(ticketHtml);
            w.document.close();
            w.focus();
            setTimeout(() => {
                w.print();
                w.close();
            }, 250);
        } else {
            alert("❌ Error al conectar con la notebook. Revisa que 'node index.js' esté activo.");
        }
    }
}

render();
</script>
</body>
</html>
